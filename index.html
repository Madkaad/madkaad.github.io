<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Animal Jam Item Archive</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
    .filters div { display: flex; flex-direction: column; }
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
    .item { border: 1px solid #ccc; padding: 5px; text-align: center; cursor: pointer; }
    .item img { max-width: 100px; max-height: 100px; display: block; margin: 0 auto 5px; }
    .lightbox { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content:center; align-items:center; }
    .lightbox img { max-width: 90%; max-height: 90%; }
    .lightbox button { position:absolute; top:20px; right:20px; padding:10px; }
    .color-options label { display: inline-block; margin-right:5px; }
  </style>
</head>
<body>

<h1>Animal Jam Item Archive</h1>

<div class="filters">
  <div>
    <label>Search:</label>
    <input type="text" id="searchInput" placeholder="Search by name">
  </div>

  <div class="color-options">
    <label>Color:</label><br>
    <label><input type="checkbox" class="colorCheck" value="white"> White</label>
    <label><input type="checkbox" class="colorCheck" value="black"> Black</label>
    <label><input type="checkbox" class="colorCheck" value="brown"> Brown</label>
    <label><input type="checkbox" class="colorCheck" value="yellow"> Yellow</label>
    <label><input type="checkbox" class="colorCheck" value="green"> Green</label>
    <label><input type="checkbox" class="colorCheck" value="red"> Red</label>
    <label><input type="checkbox" class="colorCheck" value="blue"> Blue</label>
    <label><input type="checkbox" class="colorCheck" value="pink"> Pink</label>
    <label><input type="checkbox" class="colorCheck" value="purple"> Purple</label>
    <label><input type="checkbox" class="colorCheck" value="orange"> Orange</label>
    <label><input type="checkbox" class="colorCheck" value="gray"> Gray</label>
  </div>

  <div>
    <label>Season:</label>
    <select id="seasonFilter">
      <option value="all">All</option>
      <option>Jamaaliday</option><option>Night of the Phantoms</option>
      <option>Lucky Clovers</option><option>Friendship Festival</option>
      <option>Feast of Thanks</option><option>Easter</option>
      <option>New Year</option><option>Freedom</option>
      <option value="none">No Season</option>
    </select>
  </div>

  <div>
    <label>Category:</label>
    <select id="categoryFilter">
      <option value="all">All</option>
      <option>nature</option>
      <option>other</option>
    </select>
  </div>

  <div>
    <label>Year:</label>
    <select id="yearFilter">
      <option value="all">All</option>
      <script>
        for(let y=2010;y<=2027;y++){document.write(`<option>${y}</option>`);}
      </script>
    </select>
  </div>

  <div>
    <label>Sort:</label>
    <select id="sortFilter">
      <option value="a-z">A → Z</option>
      <option value="z-a">Z → A</option>
      <option value="old-new">Old → New</option>
      <option value="new-old">New → Old</option>
    </select>
  </div>

  <div>
    <label>Membership:</label>
    <input type="checkbox" id="memberCheck" checked> Member<br>
    <input type="checkbox" id="nonMemberCheck" checked> Non-Member
  </div>
</div>

<div class="item-grid" id="itemGrid"></div>

<div class="lightbox" id="lightbox">
  <button onclick="closeLightbox()">Close</button>
  <img id="lightboxImg" src="">
  <a id="downloadLink" download>Download PNG</a>
</div>

<script>
let items = [];

// Load JSON file
fetch('items.json')
  .then(response => response.json())
  .then(data => {
    items = data;
    render(items);
  })
  .catch(err => console.error("Error loading items.json:", err));

const itemGrid = document.getElementById("itemGrid");

function render(itemsToRender){
  itemGrid.innerHTML = "";
  itemsToRender.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<img src="${item.image}" alt="${item.name}"><br>${item.name}`;
    div.onclick = ()=>openLightbox(item);
    itemGrid.appendChild(div);
  });
}

function applyFilters(){
  const search = document.getElementById("searchInput").value.toLowerCase();
  const selectedColors = Array.from(document.querySelectorAll(".colorCheck:checked")).map(c=>c.value.toLowerCase());
  const selectedSeason = document.getElementById("seasonFilter").value;
  const selectedCategory = document.getElementById("categoryFilter").value;
  const selectedYear = document.getElementById("yearFilter").value;
  const sortType = document.getElementById("sortFilter").value;
  const showMember = document.getElementById("memberCheck").checked;
  const showNonMember = document.getElementById("nonMemberCheck").checked;

  let filtered = items.filter(item=>{
    // Member filter logic
    if(!showMember && !showNonMember) return true;
    if(item.member && !showMember) return false;
    if(!item.member && !showNonMember) return false;

    // Search
    if(!item.name.toLowerCase().includes(search)) return false;

    // Color
    if(selectedColors.length>0){
      // include item if any of its colors match selected colors
      const itemColors = item.colors.map(c=>c.toLowerCase());
      if(!selectedColors.some(c=>itemColors.includes(c))) return false;
    }

    // Season
    if(selectedSeason!=="all"){
      if(selectedSeason==="none" && item.season!=="") return false;
      else if(selectedSeason!=="none" && item.season!==selectedSeason) return false;
    }

    // Category
    if(selectedCategory!=="all" && item.category!==selectedCategory) return false;

    // Year
    if(selectedYear!=="all" && item.year!=parseInt(selectedYear)) return false;

    return true;
  });

  // Sorting
  if(sortType==="a-z") filtered.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sortType==="z-a") filtered.sort((a,b)=>b.name.localeCompare(a.name));
  else if(sortType==="old-new") filtered.sort((a,b)=>a.year-b.year);
  else if(sortType==="new-old") filtered.sort((a,b)=>b.year-a.year);

  render(filtered);
}

// Lightbox
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const downloadLink = document.getElementById("downloadLink");

function openLightbox(item){
  lightbox.style.display="flex";
  lightboxImg.src = item.image;
  downloadLink.href = item.image;
  downloadLink.download = item.name+".png";
}

function closeLightbox(){
  lightbox.style.display="none";
}

// Event listeners
document.getElementById("searchInput").addEventListener("input", applyFilters);
document.querySelectorAll(".colorCheck").forEach(c=>c.addEventListener("change", applyFilters));
document.getElementById("seasonFilter").addEventListener("change", applyFilters);
document.getElementById("categoryFilter").addEventListener("change", applyFilters);
document.getElementById("yearFilter").addEventListener("change", applyFilters);
document.getElementById("sortFilter").addEventListener("change", applyFilters);
document.getElementById("memberCheck").addEventListener("change", applyFilters);
document.getElementById("nonMemberCheck").addEventListener("change", applyFilters);
</script>

</body>
</html>
